name: Nimora tests

on:
  push:
    branches: [main]
    paths:
      - 'nimora.py'
      - 'test_nimora.py'
      - '.github/workflows/nimora-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nimora.py'
      - 'test_nimora.py'
      - '.github/workflows/nimora-tests.yml'

permissions:
  contents: read

jobs:
  nimora:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Nimora tests
        run: python -m pytest -q test_nimora.py
